<!doctype html><html lang="en-NZ"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#e8f7ef"><title>Room 5's Future Village | Sustainable Design</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;600;700;800;900&display=swap');
:root{--ink:#193d39;--muted:#57746e;--green:#117a62;--bg:#f7faf5;--white:#fff;--line:#e3eae4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px 'DM Sans',Arial,sans-serif}button,a{font:inherit}button{cursor:pointer}a{color:inherit}.shell{max-width:1180px;margin:auto;padding:0 24px}.nav{background:#fff;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}.navin{display:flex;align-items:center;justify-content:space-between;min-height:75px;gap:16px}.brand{font-family:Outfit,sans-serif;font-size:22px;font-weight:900;cursor:pointer}.brand span{color:#22a878}.navlinks{display:flex;gap:8px;flex-wrap:wrap}.navlinks button,.back{border:0;background:transparent;color:#456760;padding:10px 14px;border-radius:12px;font-weight:800}.navlinks button:hover,.navlinks button.active{background:#e8f6ef;color:#117a62}.hero{margin-top:28px;border-radius:28px;background:linear-gradient(125deg,#116d60,#179878 70%,#36b993);color:white;min-height:370px;padding:46px;display:grid;grid-template-columns:1.1fr .9fr;gap:20px;overflow:hidden;position:relative}.hero h1{font:900 clamp(40px,5vw,68px)/1.02 Outfit;margin:12px 0 18px;letter-spacing:-2px}.hero p{font-size:18px;max-width:500px;line-height:1.6;color:#e2fff4}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:12px;font-weight:900}.heroart{display:grid;place-items:center}.village{font-size:clamp(90px,14vw,175px);filter:drop-shadow(0 22px 10px #07463840);transform:rotate(-5deg)}.pill{display:inline-block;border-radius:99px;padding:8px 14px;background:#ffffff24;font-size:13px;font-weight:800}.cta{border:0;border-radius:14px;background:#ffe07a;color:#31432d;padding:14px 20px;font-weight:900;margin-top:12px}.sectionhead{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:40px 0 18px}h2{font:800 30px Outfit;margin:0}h3{font:800 23px Outfit;margin:8px 0}p{line-height:1.65}.sub{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 6px 22px #1b473908}.team{min-height:205px;text-align:left;transition:transform .15s,box-shadow .15s;border:0;width:100%;display:flex;flex-direction:column;align-items:start}.team:hover{transform:translateY(-4px);box-shadow:0 12px 28px #1b47391a}.team .emoji{font-size:43px}.team p{margin:5px 0 0;color:#47675f;font-size:14px}.team .arrow{margin-top:auto;font-weight:900}.weeks{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.week{background:#fff;border:1px solid var(--line);padding:16px 12px;border-radius:16px;text-align:left}.week b{font:900 24px Outfit;color:#15906d}.week small{display:block;margin-top:8px;color:#56716a;font-weight:700}.foot{margin:60px 0 30px;padding-top:20px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}.pagehead{padding:36px 0 18px}.pagehead h1{font:900 clamp(35px,5vw,54px) Outfit;margin:12px 0}.detailhero{padding:32px;border-radius:24px;display:flex;align-items:center;gap:24px}.detailhero .bigemoji{font-size:78px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}.tabs button{border:1px solid #d8e7df;background:white;border-radius:99px;padding:12px 18px;font-weight:800;color:#46645e}.tabs button.selected{background:#147f65;color:white;border-color:#147f65}.twocol{display:grid;grid-template-columns:1.2fr .8fr;gap:20px}.feature{background:#e8f5ee;padding:24px;border-radius:20px}.feature h3{margin-top:0}.ideas{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.idea{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px}.idea .icon{font-size:35px}.idea h3{font-size:20px}.idea .tag{font-size:12px;font-weight:800;color:#08765e;text-transform:uppercase;letter-spacing:1px}.question{background:#fff2cc;padding:24px;border-radius:20px;margin-top:18px}.video{background:#fff;border-radius:20px;padding:20px;border:1px solid var(--line)}iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px}.source{display:inline-block;color:#08765e;font-weight:800;margin-top:12px}.steps{counter-reset:item;display:grid;gap:12px}.step{padding:20px;background:white;border:1px solid var(--line);border-radius:16px}.step:before{counter-increment:item;content:counter(item);display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;background:#d9f5e7;color:#08765e;font-weight:900;margin-right:12px}.promptlist li{margin:12px 0;line-height:1.6}.callout{background:#eaf6f1;padding:22px;border-radius:18px;margin:20px 0}.checklist label{display:block;padding:12px 0;border-bottom:1px solid var(--line)}.checklist input{accent-color:#128368;width:18px;height:18px;vertical-align:middle;margin-right:10px}.button{display:inline-block;border:0;background:#147f65;color:white;border-radius:12px;padding:12px 18px;font-weight:800;text-decoration:none}.tiny{font-size:13px}.thinking{margin-top:15px;padding:14px 16px;background:#f0f7ff;border-left:4px solid #498bd4;border-radius:12px}.thinking b{color:#215b94}.deeper{background:#f4f8f2;border-radius:12px;padding:14px 16px;margin:12px 0}.briefgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.briefgrid>div{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}.hidden{display:none}@media(max-width:800px){.hero{grid-template-columns:1fr;padding:30px;min-height:0}.heroart{display:none}.grid{grid-template-columns:repeat(2,1fr)}.weeks{grid-template-columns:repeat(3,1fr)}.twocol{grid-template-columns:1fr}.navin{flex-direction:column;padding:12px 0}.navlinks button{padding:8px}.detailhero{align-items:start}}@media(max-width:520px){.shell{padding:0 14px}.grid,.ideas,.briefgrid{grid-template-columns:1fr}.weeks{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:43px}.hero{padding:26px}.detailhero{padding:20px}.detailhero .bigemoji{font-size:48px}}
.blueprint-sheet{background:#fff;border:2px solid #294d47;border-radius:14px;padding:20px;margin:20px 0}.bp-title h2{margin:0}.bp-title p{font-size:13px}.bp-directions{display:flex;justify-content:space-between;gap:12px;margin:12px 0;font-size:13px}.bp-grid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));border-top:1px solid #9cb3ad;border-left:1px solid #9cb3ad}.bp-cell{aspect-ratio:1;border-right:1px solid #9cb3ad;border-bottom:1px solid #9cb3ad;position:relative}.bp-cell small{position:absolute;top:2px;left:3px;font-size:9px;color:#81948f}.bp-key{font-size:13px;line-height:2}.bp-key h3{margin-bottom:4px}.bp-notes{display:grid;grid-template-columns:1fr 1fr;gap:20px;font-size:13px}@media print{.nav,.foot,.pagehead,.callout,.sectionhead,.card,.question{display:none!important}body{background:#fff}.shell{max-width:none;padding:0}.blueprint-sheet{border:0;padding:0;margin:0;break-inside:avoid}.bp-cell{aspect-ratio:1.05}.bp-title h2{font-size:22px}}@media(max-width:600px){.bp-notes{grid-template-columns:1fr}.bp-key{font-size:11px}.bp-directions{flex-direction:column}}
.visual-gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:20px 0}.visual-card{background:white;border:1px solid var(--line);border-radius:20px;overflow:hidden}.visual-art{min-height:150px;display:flex;align-items:center;justify-content:center;gap:9px;padding:15px;background:linear-gradient(145deg,#e7f8f1,#e5efff);font-size:40px}.visual-art .visual-arrow{font-size:23px;color:#227c68}.visual-body{padding:18px}.visual-body h3{font-size:19px}.visual-body p{font-size:14px}.watch-mission{background:#e9f4ff;border-radius:16px;padding:18px;margin:15px 0}@media(max-width:800px){.visual-gallery{grid-template-columns:1fr 1fr}}@media(max-width:520px){.visual-gallery{grid-template-columns:1fr}}.resource-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:18px 0}.resource-card{border:1px solid var(--line);background:white;border-radius:20px;overflow:hidden}.resource-art{font-size:70px;text-align:center;padding:22px;background:linear-gradient(120deg,#d8f5e8,#e5edff)}.resource-content{padding:20px}.resource-content h3{font-size:20px}.resource-content .button{margin-top:12px}@media(max-width:650px){.resource-grid{grid-template-columns:1fr}} </style></head><body><header class="nav"><div class="shell navin"><div class="brand" onclick="go('home')">🌱 Room 5's <span>Future Village</span></div><nav class="navlinks"><button data-nav="home" onclick="go('home')">Home</button><button data-nav="brief" onclick="go('brief')">Mission Brief</button><button data-nav="teams" onclick="go('teams')">Learning Zones</button><button data-nav="weeks" onclick="go('weeks')">Weekly Missions</button><button data-nav="senate" onclick="go('senate')">Village Senate</button><button data-nav="blueprint" onclick="go('blueprint')">Village Blueprint</button></nav></div></header><main class="shell" id="app"></main><footer class="shell foot">Room 5's Future Village · Sustainable Design · Year 7–8 · Learn → Imagine → Design → Build · No account needed</footer><script>
const teams=[
{id:'housing',name:'Sustainable Housing',emoji:'🏡',short:'Design warmer, healthier homes that use fewer resources.',color:'#ffdfc6',problem:'Homes need energy for heating, lighting and everyday life. Building them also uses materials and creates waste. How can we make homes comfortable without using more than we need?',concepts:[['☀️','Passive solar design','In Aotearoa New Zealand, north-facing windows can welcome winter sunlight. Roof overhangs and shading can reduce overheating in summer.','Show windows on the sunny side and a roof shade.'],['🧥','Insulation','Insulation in walls, ceilings and floors slows heat escaping, so homes need less energy to stay warm.','Use a cross-section to show an insulation layer.'],['🔆','Solar panels','Solar panels turn sunlight into electricity. They work best in good sunlight and produce less power on cloudy days or at night.','Add dark blue roof panels and label where electricity goes.'],['🪵','Reused materials','Reusing suitable timber, bricks and other materials can reduce waste and demand for new resources. Materials still need to be safe and fit for purpose.','Use clean packaging to represent reused building materials.'],['🌿','Green roofs','Some roofs support plants, helping manage rainwater and support biodiversity. They need strong structures and maintenance.','Create a small planted roof and a drainage label.'],['🌬️','Natural ventilation','Well-placed windows can let fresh air flow through a home and help keep it comfortable.','Draw arrows showing airflow through windows.']],brief:'Design homes for the village that are comfortable, healthy and use fewer resources.',questions:['Where will sunlight enter your houses?','How will you keep the houses warm in winter and cool in summer?','Which building materials will you use and why?','How many homes will your village need for 100 residents?'],materials:'Cardboard boxes, paper, recycled packaging, transparent plastic offcuts, glue, coloured pens.',videoTitle:'A home designed by the sun (Australian sustainable home)',videoUrl:'https://liveatthecape.com.au/a-home-designed-by-the-sun-lucy-explores-sustainable-living-with-tom-keel/'},
{id:'energy',name:'Energy & Power',emoji:'⚡',short:'Keep the village powered with cleaner energy.',color:'#fff0ae',problem:'Our village needs electricity for lights, cooking and devices. Burning fossil fuels releases greenhouse gases. How could the village generate and manage cleaner electricity?',concepts:[['☀️','Solar electricity','Solar panels convert sunlight into electricity, but production changes with weather and time of day.','Make rooftop solar panels and connect them to homes.'],['💨','Wind turbines','Wind turns turbine blades connected to a generator. A turbine needs a suitable windy location.','Build a turbine with spinning paper blades.'],['💧','Hydropower','Moving water can turn a turbine. A suitable water source is needed, and dams can affect ecosystems.','Model a waterwheel only if your village has a realistic water source.'],['🔋','Battery storage','Batteries can store some electricity for later, such as after sunset, but have costs and material impacts.','Add a labelled community battery building.'],['💡','Energy efficiency','LED lighting, insulation and efficient appliances reduce the amount of electricity the village needs.','Add labels showing where the village saves power.'],['🔌','Power network','Electricity needs safe connections between generation, storage and buildings.','Use coloured string to represent power lines.']],brief:'Plan a realistic combination of energy sources and ways to reduce electricity demand.',questions:['What will provide electricity after dark?','Which source suits the location of your village?','How will power reach buildings?','How could your village use less electricity?'],materials:'Paper, cardboard tubes, bottle tops, string, skewers with teacher supervision, recycled boxes.',videoId:'1kUE0BZtTRc',videoTitle:'Renewable Energy 101 — National Geographic'},
{id:'transport',name:'Transport & Movement',emoji:'🚲',short:'Help everyone travel safely with less pollution.',color:'#d8eaff',problem:'Transport helps people get to school, shops and work, but many vehicles create emissions and roads use space. How can everyone get around safely and easily?',concepts:[['🚶','Walkable streets','Homes near everyday services make walking practical and reduce car journeys.','Create short footpaths between homes and key places.'],['🚲','Cycleways','Protected cycle paths make cycling safer and more appealing.','Use a different colour for cycle paths.'],['🚌','Public transport','Shared buses can move many people with fewer vehicles than separate car trips.','Add a bus stop near homes and services.'],['🚙','Electric vehicles','Electric vehicles have no tailpipe emissions, though producing vehicles and electricity still has impacts.','Create a small shared EV parking and charging area.'],['♿','Accessible design','Wide, smooth paths and crossings help people using wheelchairs, prams and mobility aids.','Show ramps and accessible crossings.'],['🗺️','Compact planning','Putting services close together reduces how far people need to travel.','Work with other teams on the village layout.']],brief:'Design a connected village that is safe, accessible and not dependent on cars.',questions:['Can residents walk to most everyday places?','How will children travel safely?','Where should bus stops and cycle paths go?','Can people with different mobility needs use your routes?'],materials:'Coloured paper, rulers, masking tape, cardboard, markers, small recycled boxes.'},
{id:'food',name:'Food & Farming',emoji:'🥕',short:'Grow food locally and reduce food waste.',color:'#ddf1ca',problem:'Growing, packaging and transporting food uses land, water and energy. Food waste also wastes those resources. How can our village provide fresh food responsibly?',concepts:[['🥬','Community gardens','Shared gardens can grow vegetables and teach residents about food production.','Build raised garden beds with labelled crops.'],['🍂','Composting','Food scraps and garden waste can decompose into compost for soil when managed correctly.','Add a three-stage compost area.'],['💧','Drip irrigation','Slow water delivery near plant roots can reduce water waste.','Draw irrigation lines from a water tank.'],['🐝','Pollinator gardens','Flowers can support bees and other pollinators that help many plants produce food.','Include flowers near the growing area.'],['🌱','Seasonal planting','Choosing crops for local seasons can improve growing success and reduce extra heating needs.','Label vegetables suited to a growing season.'],['🥫','Food sharing','Sharing surplus produce can reduce edible food being wasted.','Create a community food-sharing stall.']],brief:'Design a food-growing and food-saving system for 100 residents.',questions:['What could realistically grow in your village?','Who will look after the gardens?','Where will the water come from?','What happens to food scraps?'],materials:'Egg cartons, green paper, dried leaves, clean packaging, cardboard, glue.'},
{id:'water',name:'Water & Waste',emoji:'💧',short:'Save clean water and keep useful materials out of landfill.',color:'#cceff1',problem:'Clean water is valuable, and rubbish can pollute land and waterways. How will your village use water carefully and prevent waste?',concepts:[['🌧️','Rainwater collection','Rain from roofs can be collected for uses such as watering gardens, with appropriate storage and safety.','Add gutters and a tank connected to a roof.'],['🚿','Water-saving fixtures','Efficient taps and showers can use less water for everyday tasks.','Label low-flow fixtures inside a house.'],['♻️','Recycling stations','Sorting accepted materials makes recycling easier; local recycling rules determine what can go in each bin.','Make clearly labelled recycling bins.'],['🛠️','Repair and reuse','Fixing or reusing items can prevent waste before recycling is needed.','Create a repair and reuse workshop.'],['🌿','Rain gardens','Planted areas can slow and filter some stormwater before it reaches drains.','Build a shallow planted rain garden near paths.'],['🚰','Safe drinking water','Drinking water needs reliable treatment and protection from contamination. Rainwater is not automatically safe to drink.','Show a labelled drinking-water supply and treatment point.']],brief:'Create practical water-saving, stormwater and waste-reduction systems.',questions:['Where does clean drinking water come from?','Where will rainwater go during a storm?','What can be repaired or reused instead of thrown away?','How will residents know which waste bin to use?'],materials:'Bottle caps, clean bottles, straws, blue paper, cardboard, recycled containers.'},
{id:'nature',name:'Nature & Community',emoji:'🌳',short:'Create healthy spaces for people and local wildlife.',color:'#e8ddff',problem:'Communities need places to meet, play and relax. Plants and animals also need habitat. How can our village make space for both people and nature?',concepts:[['🌿','Native planting','Locally suitable native plants can provide food and shelter for wildlife.','Add labelled native trees and shrubs.'],['🐦','Wildlife corridors','Connected green spaces help some wildlife move between habitats.','Link gardens, trees and park areas.'],['🛝','Inclusive parks','Parks with accessible paths and different play areas can welcome more residents.','Build a park with seating, shade and accessible routes.'],['🌳','Urban shade','Trees provide shade and can help cool outdoor spaces in hot weather.','Place shade trees near paths and meeting areas.'],['🏘️','Shared community spaces','Libraries, halls and meeting places help people connect and share resources.','Build a community hub.'],['🌊','Protecting waterways','Planting and managing runoff near streams can help protect water quality and habitats.','Include a planted stream edge if the village has a waterway.']],brief:'Make the village welcoming for 100 residents while protecting local ecosystems.',questions:['Where will people meet, play and relax?','Which native plants could suit your village?','How can people of all abilities use the spaces?','How will habitats connect across the village?'],materials:'Recycled cardboard, paper, twigs, clean packaging, green fabric scraps, glue.'}
];
const weeks=[{name:'The Challenge',lead:'Understand sustainability and meet your design team.',tasks:['Explore the village mission and the six design zones.','Learn what sustainability means: caring for people, resources and the environment.','Choose or be assigned a specialist team, then select one senator to represent it.','Write down three problems your team will help solve; senators gather each team’s needs for the masterplan.'],outcome:'A team, a clear mission and three problems to investigate.'},{name:'Discover & Research',lead:'Become an expert in your design area.',tasks:['Read the Discover section in your learning zone.','Explore at least four solution cards.','Discuss advantages and limitations of different ideas.','Choose three sustainable features your team wants to investigate further.','MATERIALS COLLECTION MISSION: list safe recycled items you need, decide who can bring them and what the class can share.','SENATE MISSION: open the Village Blueprint template, sketch a first village-wide layout and identify where systems connect.'],outcome:'Three explained ideas, a recycled-material collection plan and a first Senate layout.'},{name:'The Blueprint',lead:'Plan before you build.',tasks:['Sketch your team’s structures from above and from the side.','Label how each sustainable feature works.','Present your plans to the Village Senate; negotiate space, routes and connections before approval.','Check collected recycled materials, finalise your list and make a small prototype if time allows.','SENATE CHECKPOINT: complete the Village Blueprint template, consult all teams and approve one labelled masterplan before permanent building starts.'],outcome:'A labelled design, collected materials and a Senate-approved village masterplan.'},{name:'Build It',lead:'Turn your plans into models.',tasks:['Use the safe recycled materials collected in Weeks 2–3; request extra shared supplies if needed.','Build the most important structures first.','Include labels that show how sustainable features work.','Test your model against your original sketch and improve it.'],outcome:'Main structures built and key sustainable features visible.'},{name:'Connect the Village',lead:'Make six teams work as one.',tasks:['Position each team’s models on the shared base.','Follow the Senate masterplan to connect pathways, power, water, gardens and shared spaces.','Check that the village works for 100 residents.','Make final improvements and prepare a short explanation.'],outcome:'One connected sustainable village.'},{name:'Village Showcase',lead:'Explain your design decisions.',tasks:['Show visitors what your team designed.','Explain three features and why each helps.','Describe one trade-off or limitation.','Reflect on what you would improve with more time.','SENATE REVIEW: explain how the final village works as one connected, sustainable community.'],outcome:'A completed exhibition and an individual reflection.'}];
const $=s=>document.querySelector(s);let current='home',selectedTeam='housing',tab='discover';function go(page,id){current=page;if(id)selectedTeam=id;tab='discover';render();window.scrollTo({top:0,behavior:'instant'});location.hash=page+(page==='team'?'/'+selectedTeam:page==='week'?'/'+(id||0):'')};function teamCards(){return `<div class="grid">${teams.map(t=>`<button class="card team" style="background:${t.color}" onclick="go('team','${t.id}')"><span class="emoji">${t.emoji}</span><h3>${t.name}</h3><p>${t.short}</p><span class="arrow">Explore zone →</span></button>`).join('')}</div>`};function home(){return `<section class="hero"><div><span class="pill">🌎 THE SIX-WEEK DESIGN CHALLENGE</span><h1>Build a better tomorrow.</h1><p>100 residents. Six design teams. One Village Senate. One incredible sustainable village. Discover ideas, plan smart solutions and build the future together.</p><button class="cta" onclick="go('brief')">Read your mission brief →</button></div><div class="heroart"><div class="village">🏡🌳<br>🌞🏘️</div></div></section><div class="callout"><h3>📋 Before you begin: Your Village Mission Brief</h3><p>You are part of a team of designers creating one connected, sustainable village for 100 people. Read the mission, the rules and how your team will be assessed before you begin.</p><button class="button" onclick="go('brief')">Open the full mission brief →</button></div><div class="sectionhead"><div><span class="eyebrow" style="color:#149270">CHOOSE YOUR EXPERTISE</span><h2>Six teams. One village.</h2></div></div>${teamCards()}<div class="callout"><h3>🏛️ The Village Senate</h3><p>Each specialist team selects one senator. Together, the six senators plan the village layout, resolve clashes and connect everyone’s designs. Senators still build with their own teams.</p><button class="button" onclick="go('senate')">Explore the Senate mission →</button></div><div class="sectionhead"><div><span class="eyebrow" style="color:#149270">YOUR JOURNEY</span><h2>Six weekly missions</h2></div><button class="back" onclick="go('weeks')">See all missions →</button></div>${weekCards()}<div class="callout"><h3>🎯 Our village rules</h3><p>Plan for <b>100 residents</b>. Include renewable energy, food growing, safe transport, water-saving systems, waste reduction, and welcoming green spaces. Every team must explain <b>three sustainable design decisions</b>.</p></div>`};function senatePage(){return `<div class="pagehead"><span class="eyebrow" style="color:#149270">SPECIAL LEADERSHIP MISSION</span><h1>🏛️ The Village Senate</h1><p class="sub">Six team representatives. One shared masterplan. Everyone has a voice.</p></div><section class="hero" style="min-height:0;grid-template-columns:1fr"><div><span class="pill">YOUR SENATE MISSION</span><h1>Make the village work together.</h1><p>Each specialist team designs one important part of the village. Your Senate must bring those parts together into a community that works for 100 people. Make decisions about the layout, the connections and the compromises.</p></div></section><div class="sectionhead"><h2>👥 Who joins the Senate?</h2></div><div class="card"><p>During Week 1, each of the six teams selects <b>one senator</b>. The senator stays in their own team and attends short Senate meetings to represent its ideas. They listen, negotiate and report decisions back. All students can suggest ideas to their senator.</p><div class="question"><b>Team selection prompt</b><p>Who could represent your team fairly, listen carefully and explain your team's needs? Why would they be a good senator?</p></div></div><div class="sectionhead"><h2>🗺️ Your big planning decisions</h2></div><div class="briefgrid"><div><h3>🏘️ Land use</h3><p>Where should homes, gardens, shared buildings and natural areas go? How will you leave room for 100 residents?</p></div><div><h3>🚲 Connections</h3><p>How will walking, cycling, power, water and waste systems connect without clashing?</p></div><div><h3>☀️ Smart positioning</h3><p>Where is the sun? Which areas need shade, wind protection, space or water access?</p></div><div><h3>⚖️ Trade-offs</h3><p>What happens when two teams want the same space? How will you make fair, sustainable decisions?</p></div></div><div class="sectionhead"><h2>📅 Senate meeting schedule</h2></div><div class="card"><ol class="promptlist"><li><b>Week 1 — Elect:</b> Each team selects a senator and shares its first needs.</li><li><b>Week 2 — Draft:</b> Sketch the village from above. Mark homes, food, energy, water, roads and nature. Check each team’s recycled-material needs.</li><li><b>Week 3 — Approve:</b> Gather team plans, resolve clashes and approve the labelled masterplan before anything is permanently fixed to the base.</li><li><b>Week 4 — Check:</b> Meet briefly to review construction progress and approve necessary changes.</li><li><b>Week 5 — Connect:</b> Coordinate the final layout and link systems across teams.</li><li><b>Week 6 — Explain:</b> Present how the entire village works as one sustainable community.</li></ol></div><div class="callout"><h3>📐 Senate deliverable: The Village Masterplan</h3><p>Use the <button class="button" onclick="go('blueprint')">Village Blueprint template →</button> to create one <b>large, labelled, top-down drawing</b> showing where each team will build, main paths and shared systems. Use a key and a consistent scale if practical. Ask every team to check the plan. The teacher gives final approval before permanent construction.</p></div><div class="question"><h3>🤔 Senate challenge questions</h3><p>Can every resident reach food and shared spaces without a car? Will buildings block sunlight from gardens? Where will rainwater flow? What happens to rubbish? Which designs depend on another team? What trade-offs have you made?</p></div><div class="callout"><h3>♻️ Week 2: Materials Collection Mission</h3><p>Each senator collects their team's list of <b>clean, safe, reused materials</b> and identifies shared supplies. Useful examples include cardboard packaging, paper rolls, bottle tops, scrap paper and clean plastic containers. Avoid sharp, dirty or hazardous materials. Agree on what can be brought from home and what the teacher will supply.</p></div>`} ;function briefPage(){return `<div class="pagehead"><span class="eyebrow" style="color:#149270">OFFICIAL PROJECT BRIEF</span><h1>🌍 Operation: Future Village</h1><p class="sub">Six weeks · Six specialist teams · Six senators · One shared village · 100 residents</p></div><section class="hero" style="min-height:0;grid-template-columns:1fr"><div><span class="pill">YOUR BIG MISSION</span><h1>Build a better tomorrow.</h1><p>Your class has been chosen to design a new village for 100 people. Your challenge is to help people live well while using fewer resources, producing less pollution and protecting nature. You must learn how real sustainable solutions work, choose the best ones and build one shared model that explains your ideas.</p></div></section><div class="sectionhead"><h2>🎯 What must our village achieve?</h2></div><div class="briefgrid"><div><h3>🏠 People first</h3><p>Provide suitable homes and community spaces for 100 residents. Think about comfort, safety, access and wellbeing.</p></div><div><h3>⚡ Use resources wisely</h3><p>Include renewable electricity and practical ways to save energy and water.</p></div><div><h3>🌱 Protect our environment</h3><p>Show food growing, waste reduction, green spaces and ways to support living things.</p></div><div><h3>🚲 Connect everything</h3><p>Make safe routes and connect the systems designed by different teams. The village must work as one place.</p></div></div><div class="callout"><h3>🏛️ Choose your senator during team selection</h3><p>Every specialist team nominates or selects one representative. Senators remain active team members but also meet as the Village Senate to design the overall masterplan. Choose someone who listens, communicates ideas and reports decisions back — not simply the loudest voice.</p><button class="button" onclick="go('senate')">Read the Senate mission →</button></div><div class="sectionhead"><h2>🧰 Your job as a designer</h2></div><div class="card"><ol class="promptlist"><li><b>Learn:</b> Use your learning zone to understand the problem and explore real solutions.</li><li><b>Decide:</b> Choose at least three sustainable design features for your team's contribution. Explain why you chose them.</li><li><b>Plan:</b> Sketch a labelled design, list your materials and agree on space with other teams.</li><li><b>Build:</b> Make a model using safe materials, preferably reused or recycled where practical.</li><li><b>Explain:</b> Show how your design works, what it improves and at least one limitation or trade-off.</li></ol></div><div class="sectionhead"><h2>🏆 How will we know we've succeeded?</h2></div><div class="briefgrid"><div><h3>Knowledge</h3><p>You can explain how your sustainable solutions work, not just name them.</p></div><div><h3>Thoughtful design</h3><p>Your ideas respond to real problems and consider benefits and limitations.</p></div><div><h3>Teamwork</h3><p>Everyone contributes, and your design connects with the rest of the village.</p></div><div><h3>Communication</h3><p>Your model and labels help another person understand your decisions.</p></div></div><div class="question"><h3>🤔 The big question</h3><p>If every village in Aotearoa were designed like ours, what would improve — and what challenges might still remain?</p></div><div class="callout"><h3>🗓️ Six weekly missions</h3><p>Each week you have a clear target. Check the weekly mission page so your team knows what to achieve by the end of the session.</p><button class="button" onclick="go('weeks')">See the weekly missions →</button></div>`};function weekCards(){return `<div class="weeks">${weeks.map((w,i)=>`<button class="week" onclick="go('week','${i}')"><b>0${i+1}</b><small>${w.name} →</small></button>`).join('')}</div>`};

function curatedGallery(t){return `<div class="sectionhead"><h2>📸 Real-world inspiration library</h2></div><p class="sub">Teacher-selected resources: explore photographs, diagrams, practical examples and videos. Some open in a new tab. Return here to answer the design question.</p><div class="resource-grid">${(curatedResources[t.id]||[]).map(r=>`<article class="resource-card"><div class="resource-art">${r[0]}</div><div class="resource-content"><h3>${r[1]}</h3><p>${r[2]}</p><div class="thinking"><b>🔎 Look, think, design</b><p>${r[4]}</p></div><a class="button" href="${r[3]}" target="_blank" rel="noopener noreferrer">Explore resource ↗</a></div></article>`).join('')}</div><div class="callout"><h3>♻️ Prototype inspiration mission</h3><p>Choose one real-world feature you have explored. Sketch how you could make a <b>miniature representation</b> using clean recycled materials. Label its parts, explain how it works, and show where it belongs on the Senate's village blueprint.</p><p><b>Useful materials:</b> cardboard packaging for structures, paper rolls for pipes and towers, bottle tops for wheels and tanks, egg cartons for gardens, scrap paper for roofs and signs, and clean transparent packaging for windows.</p></div>`}

function teamPage(){const t=teams.find(x=>x.id===selectedTeam)||teams[0];return `<div class="pagehead"><button class="back" onclick="go('teams')">← All learning zones</button></div><section class="detailhero" style="background:${t.color}"><div class="bigemoji">${t.emoji}</div><div><span class="eyebrow">SPECIALIST DESIGN TEAM</span><h1 style="font:900 clamp(32px,5vw,52px) Outfit;margin:8px 0">${t.name}</h1><p style="margin:0">${t.short}</p></div></section><div class="tabs">${[['discover','1 · Discover'],['solutions','2 · Explore solutions'],['inspiration','3 · Get inspired'],['design','4 · Design it']].map(([key,label])=>`<button class="${tab===key?'selected':''}" onclick="setTab('${key}')">${label}</button>`).join('')}</div><div id="tabcontent">${tabContent(t)}</div>`};function setTab(t){tab=t;$('#tabcontent').innerHTML=tabContent(teams.find(x=>x.id===selectedTeam));$('#tabcontent').scrollIntoView({behavior:'smooth',block:'start'})};const deepDetails={"Passive solar design": {"explanation": "The position of the sun changes during the day and through the seasons. A good design balances winter warmth with summer shade rather than relying on heating or air conditioning.", "question": "Which side of your model would receive the most winter sunlight in New Zealand? How would you stop rooms overheating in summer?"}, "Insulation": {"explanation": "Insulation slows the transfer of heat through a building. Gaps and draughts can still waste warmth, so a good house combines insulation with controlled ventilation.", "question": "Where would heat escape from your model house? How could you show insulation without hiding the whole design?"}, "Solar panels": {"explanation": "Solar photovoltaic cells generate direct-current electricity from light. An inverter can make this usable in a typical home; batteries or the wider power network help when sunshine is low.", "question": "How many roofs in your village could face a sunny direction? What will happen after sunset?"}, "Reused materials": {"explanation": "Making new building materials can require energy, transport and raw resources. Reuse can avoid some of these impacts, although unsuitable or unsafe materials should never be used just because they are recycled.", "question": "What can you reuse from the classroom? Would the same material be safe and durable in a real home?"}, "Green roofs": {"explanation": "Plants and soil can absorb some rainwater, provide habitats and change roof temperatures. They add weight and need suitable waterproofing, drainage and maintenance.", "question": "Which building could support a green roof? Where would excess rainwater go?"}, "Natural ventilation": {"explanation": "Opening windows on different sides can help move fresh air through a building. Wind direction, weather, security and outdoor air quality affect how well this works.", "question": "Where would you put two openings to encourage airflow? When might you need to close them?"}, "Solar electricity": {"explanation": "Solar panels generate electricity when light reaches their cells. Production is not constant, so designers also plan for energy saving, storage or connection to a wider electricity supply.", "question": "Which buildings have the best roof space? How could your village cope with several cloudy days?"}, "Wind turbines": {"explanation": "Moving air turns blades, which drive a generator. Turbines work best in reliably windy sites and need space, maintenance and careful placement to reduce impacts.", "question": "Is your proposed turbine in an open, windy location? What problems could placing it beside homes cause?"}, "Hydropower": {"explanation": "Flowing or falling water can spin a turbine and generate electricity. It can be reliable in some places, but water infrastructure may alter river habitats and flow.", "question": "Does your village actually have a suitable water source? If not, would another energy source be more realistic?"}, "Battery storage": {"explanation": "A battery stores electrical energy for later use. It can help balance solar and wind supply, but batteries are expensive and require materials that must be responsibly sourced and recycled.", "question": "What would you power first if your stored energy was limited?"}, "Energy efficiency": {"explanation": "The cleanest unit of electricity can be the one you never need to use. Efficient lights, good insulation and smart habits reduce the size and cost of the power system required.", "question": "Can your team reduce electricity demand before adding more power generators?"}};

Object.assign(deepDetails,{"Power network": {"explanation": "A village power network links generation, buildings and storage. When one source produces too little, another source or the wider grid can help. Cables, transformers and safety systems make distribution possible.", "question": "Where will your main power lines run? Which services need electricity even during a power cut?"}, "Walkable streets": {"explanation": "Short, connected walking routes make daily trips easier without a car. Safe crossings, shade and good lighting matter as much as distance, especially for children and older residents.", "question": "Can someone walk from every home to the shops, gardens and park without crossing a dangerous road?"}, "Cycleways": {"explanation": "Separated or low-traffic cycling routes help people travel without exhaust emissions. Useful cycleways connect destinations and include safe intersections and somewhere to park bikes.", "question": "Where would cyclists travel? What happens when a cycleway meets a busy road?"}, "Public transport": {"explanation": "Shared buses or shuttles can move many people using less road space than individual cars. Services need convenient stops, reliable timetables and enough riders to be useful.", "question": "Where should the bus stop go so most residents can reach it easily?"}, "Electric vehicles": {"explanation": "Electric vehicles have no tailpipe emissions, but making vehicles and batteries uses resources. Their overall impact depends partly on how electricity is generated. They do not solve congestion by themselves.", "question": "Which village journeys truly need vehicles, and where could charging points go?"}, "Accessible design": {"explanation": "Ramps, smooth paths, crossings and readable signs make places easier to use for people with wheelchairs, prams, injuries and different abilities. Accessibility should be planned from the start.", "question": "Could a wheelchair user get from a house to every important service in your village?"}, "Compact planning": {"explanation": "Putting homes, services and community spaces closer together can shorten journeys and protect land from being built over. Good planning still needs privacy, sunlight and outdoor space.", "question": "Which buildings should be close together? What trade-offs come with building too densely?"}, "Community gardens": {"explanation": "Shared gardens let residents grow vegetables near home. They can build community skills and reduce some transport needs, but need sunlight, healthy soil, water and ongoing care.", "question": "Where will your garden get sunlight, water and compost? Who will maintain it?"}, "Composting": {"explanation": "Food scraps and garden waste can break down into material that improves soil. Compost needs a balance of wet and dry material, air and moisture; not every type of waste belongs in it.", "question": "Where would a compost area go so it is convenient but does not create problems for neighbours?"}, "Drip irrigation": {"explanation": "Drip systems deliver small amounts of water near plant roots, often reducing evaporation and overspray. They still need maintenance and sensible watering schedules.", "question": "How could you show water travelling from a tank to the roots of crops?"}, "Pollinator gardens": {"explanation": "Flowering plants can provide food and habitat for bees and other pollinators. Diverse plants that flower at different times support wildlife and can help some food crops.", "question": "Which flowers or native plants could help pollinators throughout the year?"}, "Seasonal planting": {"explanation": "Different crops grow best in different temperatures and daylight conditions. Choosing seasonal crops can reduce the need for heated growing spaces and help make harvests more reliable.", "question": "What could your village grow in a New Zealand winter compared with summer?"}, "Food sharing": {"explanation": "Community pantries and shared harvest programmes can redirect surplus edible food instead of throwing it away. They need safe storage, clear rules and people to organise them.", "question": "How will surplus food get to residents who need it before it spoils?"}, "Rainwater collection": {"explanation": "Rain falling on roofs can flow through gutters into a tank. Collected water may be useful for gardens or toilet flushing; drinking water needs appropriate treatment and safety checks.", "question": "Which roofs will feed your tanks? What happens when a tank is full or empty?"}, "Water-saving fixtures": {"explanation": "Low-flow taps, efficient showers and dual-flush toilets can reduce the amount of clean water used each day. Savings depend on how people use them and whether they are maintained.", "question": "Which activity uses the most water in your village, and how might you reduce it?"}, "Recycling stations": {"explanation": "Clearly labelled collection points help separate materials that local recycling services accept. Contamination can make recycling harder, so reducing and reusing should come first.", "question": "Where should collection stations go, and how will people know what belongs in each bin?"}, "Repair and reuse": {"explanation": "Repairing clothes, appliances and furniture can extend their useful life and reduce demand for new products. Shared tools and repair spaces also make resources more accessible.", "question": "Could your village include a repair workshop or swap shelf? What would people bring there?"}, "Rain gardens": {"explanation": "A rain garden is a planted shallow area that receives runoff from roofs or paths. Soil and plants slow and filter some water before it drains away; designs must manage heavy rainfall safely.", "question": "Where would water flow during a storm? Could a rain garden intercept it before it reaches a stream?"}, "Safe drinking water": {"explanation": "Safe drinking water depends on a protected source, treatment, testing and reliable pipes. A rainwater tank alone does not guarantee safe drinking water.", "question": "How will your village supply safe drinking water during a drought or equipment failure?"}, "Native planting": {"explanation": "Plants native to the local region can provide habitat and food for native animals. The right species depends on soil, sunlight, rainfall and the particular ecosystem.", "question": "Which plants are native to your part of Aotearoa, and where would each grow best?"}, "Wildlife corridors": {"explanation": "Connected strips of vegetation can help animals move between habitats rather than being trapped in isolated patches. Roads, fences and bright lighting can interrupt these connections.", "question": "Can a bird or lizard move between green areas without crossing an exposed space?"}, "Inclusive parks": {"explanation": "Well-designed parks offer play, rest and social space for different ages and abilities. Shade, seating, accessible paths and safe sightlines help more people enjoy them.", "question": "Would a younger child, a teenager and an older resident all find something useful in your park?"}, "Urban shade": {"explanation": "Trees and shade structures can cool outdoor spaces by blocking sunlight and, for trees, through evaporation from leaves. Trees need room for roots and ongoing care.", "question": "Which paths and gathering spaces will be hottest in summer? Where would shade help most?"}, "Shared community spaces": {"explanation": "Libraries, halls and shared workshops allow residents to use resources together instead of everyone needing their own. Successful spaces need convenient access, upkeep and fair rules.", "question": "Which facilities could 100 residents share? Where should they be located?"}, "Protecting waterways": {"explanation": "Healthy streams need clean water, vegetation along banks and protection from litter and polluted runoff. Planting buffers can help, but managing pollution at its source is also important.", "question": "How will you stop rubbish and dirty stormwater reaching the village stream?"}});
function deepDive(t,c){return (deepDetails[c[1]]||{}).explanation||`Think about the whole life of this solution: where its materials come from, how it operates, what resources it saves, and what maintenance it might need. A design can have environmental benefits while still using space, materials or energy. Your job is to compare those trade-offs before choosing.`}
function thinkingPrompt(t,c){return (deepDetails[c[1]]||{}).question||`How would ${c[1].toLowerCase()} work in a village for 100 people? Where would you place it, what could go wrong, and how would your model show its benefit?`}

const visualLibrary={
 housing:[['☀️','🏠','🌡️','Sun-smart house','Sunlight enters windows in winter, while shade helps prevent overheating in summer.','Which side of your model will face north? How could a cardboard overhang show shade?'],['🧱','🧥','🏡','Insulation layers','Insulation slows heat movement through the roof, walls and floor. It does not create heat.','Could you use two layers of cardboard with scrap paper between them?'],['🌧️','🌿','🏠','Living roof','A planted roof can slow runoff and create habitat, but it needs drainage and structural support.','How will you represent drainage without using real soil or water?']],
 energy:[['☀️','🔆','🏠','Solar to homes','Panels generate electricity in daylight. Homes still need electricity after dark.','Where would you place panels and how could string show the power network?'],['💨','🌬️','⚙️','Wind power','Moving air turns blades linked to a generator. Location and wind strength matter.','Can reused paper form blades that turn safely?'],['🔆','🔋','💡','Store and save','A battery can store some energy, while efficient lighting reduces demand.','What recycled box could represent storage? What labels explain its job?']],

 food:[['🌞','🥬','💧','Growing conditions','Food gardens need suitable sunlight, soil and water, plus protection from damage.','Where will the Senate place gardens so buildings do not shade them?'],['🍂','♻️','🌱','Compost loop','Suitable food scraps and garden waste can become compost that improves soil.','How could you model a closed loop using reused arrows and boxes?'],['🏡','🥕','👨‍👩‍👧','Local food','Community gardens can provide some fresh food, but a village still needs other food sources.','How much space can the village realistically dedicate to growing food?']],

 nature:[['🌳','🐦','🌼','Habitat connections','Connected planting provides shelter and food for wildlife, not just decoration.','How could scrap paper and packaging show continuous planting areas?'],['🌦️','🌳','🧑','Shade and comfort','Trees can provide shade and help make public spaces more pleasant on hot days.','Where do people need shade without blocking solar panels?'],['🏡','🛝','🤝','Shared spaces','Accessible parks and gathering places support wellbeing and community connections.','Can residents of different ages reach the park safely?']]
};
function visualGallery(t){return `<h2>👀 Visual idea gallery</h2><p class="sub">Three illustrated systems to help you understand the idea. These are <b>learning diagrams, not finished model plans</b>. Decide how to adapt them using recycled materials.</p><div class="visual-gallery">${visualLibrary[t.id].map(v=>`<article class="visual-card"><div class="visual-art" aria-label="${v[3]}"><span>${v[0]}</span><span class="visual-arrow">➜</span><span>${v[1]}</span><span class="visual-arrow">➜</span><span>${v[2]}</span></div><div class="visual-body"><h3>${v[3]}</h3><p>${v[4]}</p><div class="thinking"><b>💭 Sketch and discuss</b><p>${v[5]}</p></div></div></article>`).join('')}</div>`}
function tabContent(t){if(tab==='discover')return `<div class="twocol"><div class="card"><span class="eyebrow" style="color:#14896b">THE PROBLEM</span><h2>What needs to change?</h2><p>${t.problem}</p><div class="question"><b>🤔 Think about it</b><p>What might happen if our village ignored this problem?</p></div></div><div class="feature"><h3>🎯 Your team mission</h3><p>${t.brief}</p><button class="button" onclick="setTab('solutions')">Explore possible solutions →</button></div></div><div class="callout"><h3>What is sustainable design?</h3><p>It means making thoughtful choices about how something is made and used, so it meets people's needs while reducing harm to the environment and considering future generations. Good design considers trade-offs: every solution has benefits and limitations.</p></div>`;if(tab==='solutions')return `<h2>Explore possible solutions</h2><p class="sub">Read each idea carefully. Discuss the designer question with your group. You do not have to use all the ideas: compare their benefits and limitations, then choose the ones that fit your village best.</p><div class="ideas">${t.concepts.map(c=>`<article class="idea"><div class="icon">${c[0]}</div><h3>${c[1]}</h3><p>${c[2]}</p><div class="deeper"><b>🔎 Look deeper</b><p>${deepDive(t,c)}</p></div><div class="tag">Model idea</div><p>${c[3]}</p><div class="thinking"><b>💭 Think like a designer</b><p>${thinkingPrompt(t,c)}</p><p><b>♻️ Recycled-material challenge:</b> What recycled or reused material could you use to build a prototype of ${c[1].toLowerCase()}? How will your model make it clear how the real solution works?</p></div></article>`).join('')}</div><div class="question"><b>Decision time:</b> Which three solutions would make the biggest difference for our village? Explain why.</div>`;if(tab==='inspiration')return `<h2>See it in the real world</h2><p class="sub">Use the diagrams and optional video to understand a real system, then decide what you could adapt for your own model.</p>${visualGallery(t)}${curatedGallery(t)}${t.videoId?`<div class="video"><h3>▶ ${t.videoTitle}</h3><iframe src="https://www.youtube-nocookie.com/embed/${t.videoId}" title="${t.videoTitle}" loading="lazy" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe><a class="source" target="_blank" rel="noopener" href="https://www.youtube.com/watch?v=${t.videoId}">Open video on YouTube ↗</a></div>`:t.videoUrl?`<div class="video"><h3>🎬 ${t.videoTitle}</h3><p>Explore a real sustainable home and how its design uses sunlight and airflow.</p><a class="button" href="${t.videoUrl}" target="_blank" rel="noopener">Watch the video and explore ↗</a></div>`:''}<div class="card" style="margin-top:16px"><h3>🎥 Watch with a purpose</h3><p>Before watching, predict one sustainable feature you might see. While watching, sketch or note one useful idea. Afterwards, explain what you would adapt for our village and why.</p><div class="watch-mission"><b>🎯 Video mission</b><p>Find one feature that would work in Room 5’s village. Sketch it, name the recycled materials you would use, and explain one limitation.</p></div></div><div class="card" style="margin-top:16px"><h3>🇳🇿 Trusted places to learn more</h3><p class="sub">Optional teacher-approved resources with New Zealand examples. These are external sites, not required reading.</p><p><a class="source" target="_blank" rel="noopener" href="https://www.genless.govt.nz/">Gen Less — energy, transport and lower-emissions choices ↗</a></p><p><a class="source" target="_blank" rel="noopener" href="https://www.doc.govt.nz/">Department of Conservation — native species and habitats ↗</a></p><p><a class="source" target="_blank" rel="noopener" href="https://environment.govt.nz/">Ministry for the Environment — waste, water and climate ↗</a></p></div><div class="callout"><h3>♻️ Recycled-material prototype lab</h3><p>Try matching real features to model materials: clean cardboard for buildings and paths; paper rolls for towers and pipes; bottle tops for wheels and tanks; clean clear packaging for windows; scrap paper for solar panels, plants and labels; string for routes and connections. These are <b>representations</b>, not working electricity or drinking-water systems. Ask your teacher before using sharp tools or unfamiliar materials.</p></div><div class="callout"><h3>🛠️ Turn inspiration into a model</h3><p><b>Observe → Sketch → Choose materials → Make a prototype → Improve.</b> You are not copying a real building at full scale. Use simple shapes and clear labels to show how your sustainable solution would work.</p></div><div class="question"><b>Look closely:</b> What makes the design sustainable? Which recycled materials would best represent that part, and why?</div>`;return `<div class="twocol"><div class="card"><span class="eyebrow" style="color:#128b6a">YOUR DESIGN BRIEF</span><h2>From idea to model</h2><p>${t.brief}</p><h3>Answer these questions in your book</h3><ol class="promptlist">${t.questions.map(q=>`<li>${q}</li>`).join('')}</ol><h3>Suggested materials</h3><p>${t.materials}</p><div class="thinking"><b>♻️ Prototype materials mission</b><p>Which recycled or reused materials will you collect for each feature? Explain why each material is suitable, and how you will join the pieces safely.</p></div></div><div class="feature"><h3>✏️ Sketch before you build</h3><ol class="promptlist"><li>Choose at least three sustainable features.</li><li>Draw your idea from above.</li><li>Label each feature and explain how it works.</li><li>List recycled or reused materials for each feature, and explain your choices.</li><li>Check how your model connects with another team.</li></ol><p><b>Remember:</b> A thoughtful design matters more than a perfect-looking model.</p></div></div><div class="question"><h3>Before you start building…</h3><p>Can every team member explain what you are building, why it is sustainable and how it fits into the shared village?</p></div>`};function weekPage(i){let w=weeks[i]||weeks[0];return `<div class="pagehead"><button class="back" onclick="go('weeks')">← All weekly missions</button><h1>Week ${i+1}: ${w.name}</h1><p class="sub">${w.lead}</p></div><div class="twocol"><div class="card"><h2>🎯 This week's steps</h2><div class="steps" style="margin-top:18px">${w.tasks.map(t=>`<div class="step">${t}</div>`).join('')}</div></div><div class="feature"><h3>🏁 By the end of this week</h3><p>${w.outcome}</p><h3>Need ideas?</h3><p>Visit your specialist learning zone to learn, compare solutions and plan your design.</p><button class="button" onclick="go('teams')">Open learning zones →</button></div></div><div class="sectionhead"><h2>Jump to another week</h2></div>${weekCards()}`};function blueprintPage(){const cols='ABCDEFGHIJ'.split('');return `<div class="pagehead"><span class="eyebrow" style="color:#149270">SENATE DESIGN STUDIO</span><h1>🗺️ The Village Blueprint</h1><p class="sub">One masterplan for Room 5's Future Village. Plan first. Build second.</p></div><div class="callout"><h3>🎯 Your mission</h3><p>As the Village Senate, agree on where everything belongs before any team permanently fixes models to the base. This is a <b>planning template</b>, not a finished design. Print it, sketch together and show your teacher.</p><button class="button" onclick="window.print()">🖨️ Print the blueprint →</button></div><section class="blueprint-sheet"><div class="bp-title"><h2>ROOM 5 — VILLAGE MASTERPLAN</h2><p>Senators: __________________________ &nbsp; Date: __________ &nbsp; Version: ______</p></div><div class="bp-directions"><b>North ↑</b> <span>Proposed scale: 1 square = ______ metres &nbsp; (decide as a team)</span></div><div class="bp-grid">${Array.from({length:10},(_,r)=>cols.map((c,i)=>`<div class="bp-cell"><small>${c}${r+1}</small></div>`).join('')).join('')}</div><div class="bp-key"><h3>Colour key / symbols</h3><div>🏡 Housing ________ &nbsp; ⚡ Energy ________ &nbsp; 🚲 Transport ________</div><div>🥕 Food ________ &nbsp; 💧 Water & Waste ________ &nbsp; 🌳 Nature ________</div><div>Walking / cycling routes: __________ &nbsp; Shared systems: __________</div></div><div class="bp-notes"><div><b>Connections between teams</b><p>________________________________________________________</p><p>________________________________________________________</p></div><div><b>Important compromises / decisions</b><p>________________________________________________________</p><p>________________________________________________________</p></div></div></section><div class="sectionhead"><h2>🏛️ Senate planning checklist</h2></div><div class="card"><ol class="promptlist"><li><b>Ask every team:</b> How much space do you need? What must be nearby? What materials are you collecting?</li><li><b>Choose a scale:</b> Measure the real model base and decide what each grid square represents.</li><li><b>Mark the land:</b> Place homes, food areas, energy systems, water and waste facilities, and nature spaces.</li><li><b>Connect everything:</b> Draw walking and cycling routes; show how water, energy and waste systems work across the village.</li><li><b>Test the plan:</b> Can 100 people live well here? Do buildings shade the gardens? Can residents reach important places without a car?</li><li><b>Get approval:</b> Show each team, make changes, then get teacher approval before permanent construction.</li></ol></div><div class="question"><h3>💭 Senate challenge</h3><p>What is one decision that improves the whole village but means one team must change its original idea? Explain the compromise.</p></div><div class="callout"><h3>🏁 Mission complete when…</h3><p>You have a labelled top-down plan, a key, routes and shared systems, input from all six teams, and teacher approval. <b>Keep the blueprint beside your physical village during construction.</b></p></div>`} ;
function render(){document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===current||(current==='team'&&b.dataset.nav==='teams')||(current==='week'&&b.dataset.nav==='weeks')));$('#app').innerHTML=current==='home'?home():current==='brief'?briefPage():current==='senate'?senatePage():current==='blueprint'?blueprintPage():current==='teams'?`<div class="pagehead"><span class="eyebrow" style="color:#149270">BECOME AN EXPERT</span><h1>Choose your learning zone</h1><p class="sub">Discover real solutions, collect ideas and plan your part of the village.</p></div>${teamCards()}`:current==='team'?teamPage():current==='weeks'?`<div class="pagehead"><span class="eyebrow" style="color:#149270">THE SIX-WEEK JOURNEY</span><h1>Weekly missions</h1><p class="sub">One clear challenge at a time. Learn first, then design and build.</p></div>${weekCards()}<div class="callout">Each week is one two-hour class. Your teacher will tell you which mission to complete.</div>`:current==='week'?weekPage(Number(selectedTeam)):home()};function init(){let h=decodeURIComponent(location.hash.slice(1)).split('/');if(h[0]==='team'&&teams.some(t=>t.id===h[1])){current='team';selectedTeam=h[1]}else if(h[0]==='week'){current='week';selectedTeam=h[1]||'0'}else if(['home','brief','teams','weeks','senate','blueprint'].includes(h[0]))current=h[0];render()}window.addEventListener('hashchange',init);init();
</script></body></html>
